trigger:
  branches:
    include:
      - main
      - feature/*

pr:
  branches:
    include:
      - main
      - feature/*

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: SonarCloudAnalysis
  displayName: SonarCloud Analysis Stage

  jobs:
  - job: Analyze
    displayName: Run SonarCloud Analysis

    steps:
    - checkout: self
      fetchDepth: 0

    - task: NodeTool@0
      displayName: 'Use Node.js'
      inputs:
        versionSpec: '20.x'

    - script: |
        npm ci
      displayName: 'Install Dependencies'

    - task: SonarCloudPrepare@3
      displayName: 'Prepare SonarCloud Analysis'
      inputs:
        SonarCloud: 'sdk_sonar'
        organization: 'fastpix'
        scannerMode: 'cli'
        configMode: 'manual'
        cliProjectKey: 'FastPix_React-uploader-sdk'
        cliProjectName: 'React-uploader-sdk'
        cliSources: '.'
        extraProperties: |
          sonar.projectKey=FastPix_React-uploader-sdk
          sonar.organization=fastpix
          sonar.projectName=React-uploader-sdk
          sonar.sourceEncoding=UTF-8
          sonar.sources=.

    - script: |
        npm run build
      displayName: 'Build Project'

    - task: SonarCloudAnalyze@3
      displayName: 'Run SonarCloud Code Analysis'

    - task: SonarCloudPublish@3
      displayName: 'Publish SonarCloud Quality Gate Results'
      inputs:
        pollingTimeoutSec: '300'