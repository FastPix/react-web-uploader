trigger:
  branches:
    include:
      - main
      - feature/*

pr:
  branches:
    include:
      - main
      - feature/*

pool:
  vmImage: 'ubuntu-latest'

steps:
  - checkout: self
    fetchDepth: 0

  - task: SonarCloudPrepare@3 # NOSONAR
    displayName: 'Prepare SonarCloud Analysis'
    inputs:
      SonarCloud: 'sdk_sonar'
      organization: 'fastpix'
      scannerMode: 'CLI'
      configMode: 'manual'
      cliProjectKey: 'FastPix_React-uploader-sdk'
      cliProjectName: 'React-uploader-sdk'
      cliSources: '.'
      extraProperties: |
        sonar.projectKey=FastPix_React-uploader-sdk
        sonar.organization=fastpix
        sonar.projectName=React-uploader-sdk
        sonar.sources=.
        sonar.sourceEncoding=UTF-8

  - task: SonarCloudAnalyze@3 # NOSONAR
    displayName: 'Run SonarCloud Analysis'

  - task: SonarCloudPublish@3 # NOSONAR
    displayName: 'Publish Quality Gate Result'
    inputs:
      pollingTimeoutSec: '300'